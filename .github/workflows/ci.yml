name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public scan
        run: python3 tools/check-public.py

      - name: Package manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Python syntax
        run: |
          python3 -m py_compile host/enroll.py host/hostlib.py host/pair.py tools/check-public.py tools/mock-ts-api.py

      - name: Shell syntax
        run: |
          for f in $(git ls-files '*.sh' '*.command'); do
            bash -n "$f"
          done

      - name: ShellCheck errors
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S error --shell=bash $(git ls-files '*.sh' '*.command')

      - name: Self-tests
        run: |
          bash host/setup.sh --version
          bash host/provision.sh --version
          bash host/pair.sh --help
          python3 host/pair.py --self-test
          bash host/ensure-acl.sh --self-test
          bash host/guest-key.sh --self-test
          bash app/herdr-setup.sh --self-test
          bash client/setup-macos.sh --self-test

      - name: Host services
        run: python3 tools/test-host-services.py

      - name: Boot guard
        run: python3 tools/test-boot-guard.py

      - name: Pairing service tests
        run: python3 tools/test-pair.py

      - name: Mock Tailscale API
        run: bash tools/test-ts-api.sh

      - name: Desktop entries
        run: |
          if ! command -v desktop-file-validate >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y desktop-file-utils
          fi
          ./host/install-desktop.sh
          desktop-file-validate host/Herdr-Provision.desktop
          desktop-file-validate app/Herdr-Setup.desktop
          desktop-file-validate "$HOME/.local/share/applications/herdr-remote-setup.desktop"
          desktop-file-validate "$HOME/.local/share/applications/herdr-share.desktop"
          desktop-file-validate "$HOME/.local/share/applications/herdr-new-client-code.desktop"
          desktop-file-validate "$HOME/Desktop/herdr-remote-setup.desktop"
          desktop-file-validate "$HOME/Desktop/herdr-share.desktop"
          test ! -e "$HOME/.local/share/applications/herdr-setup-app.desktop"
          test ! -e "$HOME/Desktop/herdr-setup-app.desktop"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package
        shell: powershell
        run: .\tools\verify-package.ps1

      - name: Client self-test
        shell: powershell
        run: .\client\setup.ps1 -SelfTest

      - name: Pair client self-test
        shell: powershell
        run: .\client\pair.ps1 -SelfTest

      - name: Watchdog self-test
        shell: powershell
        run: .\client\watchdog.ps1 -SelfTest

      - name: Pair client join code self-test
        shell: powershell
        run: |
          $code = 'tskey' + '-auth-' + 'example-not-a-key'
          .\client\pair.ps1 -SelfTest -JoinCode $code

      - name: Simple app self-test
        shell: powershell
        run: .\app\herdr-connect.ps1 -SelfTest

      - name: App self-test
        shell: powershell
        run: .\app\herdr-setup.ps1 -SelfTest

      - name: App launcher self-test
        shell: cmd
        run: app\Herdr-Setup.cmd -SelfTest

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash version
        run: bash --version | head -1

      - name: macOS client self-test
        run: bash client/setup-macos.sh --self-test

      - name: App self-test
        run: bash app/herdr-setup.sh --self-test

      - name: Watchdog self-test
        run: bash client/watchdog-macos.sh --self-test

      - name: Shell syntax
        run: |
          for f in $(git ls-files '*.sh' '*.command'); do
            bash -n "$f"
          done

      - name: Watchdog selector
        run: python3 tools/test-watchdog-selector.py

      - name: LaunchAgent plist
        run: bash client/install-watchdog-macos.sh --dry-run
